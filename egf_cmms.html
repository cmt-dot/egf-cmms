<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGF Computer Maintenance Management System</title>
<style>
:root{--blue:#1F5FAD;--blue-l:#E8F0FB;--green:#2E8B57;--green-l:#E6F4EC;--red:#C0392B;--red-l:#FBE9E7;--amber:#B9770E;--amber-l:#FDF3E1;--ink:#1E2A38;--mute:#6B7785;--line:#E3E8EF;--bg:#F6F8FB;--card:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:230px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:14px}.brand small{color:var(--mute);font-size:11px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px;cursor:pointer}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--blue-l);color:var(--blue);font-weight:600}
main{flex:1;min-width:0;padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.demo{background:var(--amber-l);color:var(--amber)}
.live{background:var(--green-l);color:var(--green)}
.off{background:var(--red-l);color:var(--red)}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:600}
.btn{border:0;background:var(--blue);color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.g{background:var(--green)}.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .n{font-size:24px;font-weight:700}
.card .t{color:var(--mute);font-size:12px}
.card .n.blue{color:var(--blue)}.card .n.green{color:var(--green)}.card .n.red{color:var(--red)}.card .n.amber{color:var(--amber)}
.two{grid-template-columns:1fr 1fr}
@media(max-width:900px){.two{grid-template-columns:1fr}aside{display:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 12px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.bar span:first-child{width:90px;color:var(--mute)}
.bar .track{flex:1;background:var(--bg);border-radius:6px;height:12px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue)}
.bar .v{width:40px;text-align:right}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px;background:var(--bg);cursor:pointer;white-space:nowrap}
tr.over td{background:#FFF8F6}
.wrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--blue-l);color:var(--blue)}.b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)}.b-amber{background:var(--amber-l);color:var(--amber)}.b-grey{background:#EEF1F5;color:var(--mute)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step{padding:5px 10px;border-radius:999px;font-size:11px;background:#EEF1F5;color:var(--mute)}
.step.done{background:var(--green-l);color:var(--green)}.step.cur{background:var(--blue);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.err{color:var(--red);font-size:12px;margin-top:6px}
.ok{background:var(--green-l);color:var(--green);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.muted{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.4);display:none;place-items:center;padding:16px;z-index:9}
.modal.show{display:grid}
.modal .box{background:#fff;border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--mute)}
@media(max-width:700px){main{padding:14px}}

/* ---- App look ---- */
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#14355F 0%,#1F5FAD 60%,#2E8B57 100%);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px;box-shadow:0 6px 18px rgba(20,53,95,.2)}
.hero img{flex-shrink:0;height:72px!important;background:#fff;border-radius:12px;padding:6px}
.hero-t{font-size:20px;font-weight:700;letter-spacing:-.2px}
.hero-s{font-size:13px;opacity:.85;margin-top:2px}
aside .brand .logo{background:#fff!important}
body{background:#EEF2F7}
aside{background:linear-gradient(180deg,#14355F 0%,#1F5FAD 100%);border:0;color:#fff;box-shadow:2px 0 12px rgba(0,0,0,.08)}
.brand b,.brand small{color:#fff}.brand small{opacity:.75}
.brand .logo{background:#fff;color:var(--blue)}
aside nav a{color:rgba(255,255,255,.85);border-radius:10px;padding:10px 12px}
aside nav a:hover{background:rgba(255,255,255,.12)}
aside nav a.on{background:#fff;color:var(--blue);box-shadow:0 2px 6px rgba(0,0,0,.12)}
aside div[style*="margin-top:18px"]{color:rgba(255,255,255,.7)!important}
aside div[style*="margin-top:18px"] b{color:#fff!important}
main{padding:0 0 84px}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;margin:0 0 18px}
.topbar h1{font-size:19px}
.content{padding:0 26px}
.card,.panel{border:0;border-radius:14px;box-shadow:0 1px 3px rgba(20,40,70,.06),0 4px 14px rgba(20,40,70,.05)}
.card{position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.card .n{font-size:26px;letter-spacing:-.3px}
.btn{border-radius:10px;padding:10px 16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:active{transform:scale(.98)}
input,select,textarea{border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
th{text-transform:uppercase;letter-spacing:.03em;font-size:11px}
tbody tr:hover td{background:#F7FAFE}
.pill{letter-spacing:.02em}
.panel h2{font-size:14px;letter-spacing:.01em}
.tabbar{display:none}
@media(max-width:900px){
  .content{padding:0 14px}
  .topbar{padding:12px 14px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);z-index:8;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;text-align:center;font-size:10px;color:var(--mute);padding:6px 2px;border-radius:10px;cursor:pointer;line-height:1.2}
  .tabbar a.on{color:var(--blue);font-weight:700;background:var(--blue-l)}
  .tabbar .ic{display:block;font-size:17px;margin-bottom:2px}
  .two{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:901px){.tabbar{display:none!important}}


/* ---- Sign-in gate ---- */
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#14355F,#1F5FAD 60%,#2E8B57);align-items:center;justify-content:center;padding:16px;z-index:50}
.gatebox{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:420px;max-height:92vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.gatebox h2{margin:0 0 10px;font-size:18px;color:#14355F}
.gatebox label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.gatebox input,.gatebox select{width:100%}
.gatebox .btn{width:100%;margin-top:14px}
.gate-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.gate-links{margin-top:14px;text-align:center;font-size:13px}
.gate-links a{color:var(--blue)}
.gmsg{margin-top:12px;font-size:13px;display:none}
#roleSel,label:has(#roleSel){display:none!important}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand" id="brandLogo"></div>
  <nav id="nav"></nav>
  <div style="margin-top:18px;padding:10px;font-size:11px;color:var(--mute)">Signed in as<br><b id="whoName" style="color:var(--ink)"></b><br><a href="#" onclick="signOut();return false" style="color:#fff">Sign out</a></div>
</aside>
<main>
  <div class="topbar"><div class="top" style="margin:0">
    <div><h1 id="pageTitle">Dashboard</h1><div class="muted" style="font-size:12px" id="dataBadge"></div></div>
    <div class="row">
      <label style="margin:0;display:flex;gap:6px;align-items:center">Role
        <select id="roleSel" style="width:auto" onchange="setRole(this.value)">
          <option>Admin</option><option>Project Head</option><option>Trainer</option><option>Technician</option><option>Approver</option>
        </select>
      </label>
    </div>
  </div></div>
  <div class="content" id="view"></div>
</main>
</div>

<nav class="tabbar" id="tabbar"></nav>
<div class="gate" id="gate" style="display:none"><div class="gatebox">
  <div class="gate-head"><div id="gateLogo"></div><div><b style="font-size:16px">EGF Maintenance CMMS</b><div class="muted" style="font-size:12px">Ekal Gramothan Foundation</div></div></div>
  <div id="gLogin">
    <h2>Sign in</h2>
    <label>User ID</label><input id="gId" autocomplete="username">
    <label>Password</label><input id="gPw" type="password" autocomplete="current-password">
    <button class="btn" id="gLoginBtn" onclick="gLogin()">Sign in</button>
    <div class="gate-links"><a href="#" onclick="gShow('gSignup');return false">Create account</a> &nbsp;·&nbsp; <a href="#" onclick="gShow('gReset');return false">Forgot password?</a></div>
  </div>
  <div id="gSignup" style="display:none">
    <h2>Create account</h2>
    <div id="gSignup1">
      <label>User ID *</label><input id="sId">
      <label>Full name *</label><input id="sName">
      <label>Email *</label><input id="sEmail" type="email">
      <label>Mobile (optional)</label><input id="sMobile" maxlength="10">
      <label>Role *</label><select id="sRole"><option>Trainer</option><option>Technician</option></select>
      <label>Password *</label><input id="sPw" type="password">
      <label>Confirm password *</label><input id="sPw2" type="password">
      <button class="btn" id="sBtn1" onclick="gSignupStart()">Send verification code</button>
    </div>
    <div id="gSignup2" style="display:none">
      <p class="muted" style="font-size:13px">Enter the 6-digit code sent to your email.</p>
      <label>Verification code *</label><input id="sCode" inputmode="numeric" maxlength="6">
      <button class="btn" id="sBtn2" onclick="gSignupVerify()">Verify and create account</button>
    </div>
    <div class="gate-links"><a href="#" onclick="gShow('gLogin');return false">Back to sign in</a></div>
  </div>
  <div id="gReset" style="display:none">
    <h2>Reset password</h2>
    <div id="gReset1">
      <label>Registered email *</label><input id="rEmail" type="email">
      <button class="btn" id="rBtn1" onclick="gResetStart()">Send verification code</button>
    </div>
    <div id="gReset2" style="display:none">
      <label>Verification code *</label><input id="rCode" inputmode="numeric" maxlength="6">
      <label>New password *</label><input id="rPw" type="password">
      <label>Confirm new password *</label><input id="rPw2" type="password">
      <button class="btn" id="rBtn2" onclick="gResetVerify()">Change password</button>
    </div>
    <div class="gate-links"><a href="#" onclick="gShow('gLogin');return false">Back to sign in</a></div>
  </div>
  <div id="gMsg" class="gmsg"></div>
</div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>

function attachUI(t){
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">

    </div>

    <div class="form" style="margin-top:12px"><div class="full"><label>Video link (https)</label><input id="attUrl" placeholder="https://www.youtube.com/..."></div></div>

  </div>`;

async function loadAttachments(id){
  const box=document.getElementById("attBox"); if(!box) return;
  try{
    const j=await serverGet({action:"attachments",ticket:id});
    box.innerHTML=j.rows.length
      ? j.rows.map(a=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="badge b-blue">${esc(a["Type"])}</span> <a href="${esc(a["Link"])}" target="_blank" rel="noopener">${esc(a["Name"]||a["Link"])}</a> <span class="muted" style="font-size:11px">· ${esc(a["Uploaded By"])}</span></div>`).join("")
      : "No attachments yet.";
  }catch(e){ box.textContent="Could not load attachments: "+e.message; }
}
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]);
    r.onerror=()=>rej(new Error("Could not read the file"));
    r.readAsDataURL(file);
  });
}
async function uploadAttachment(id){
  const f=document.getElementById("attFile").files[0];
  if(!f){ flash={type:"err",msg:"Choose a file first."}; return render(); }
  if(f.size>5*1024*1024){ flash={type:"err",msg:"The file is larger than 5 MB."}; return render(); }
  const type=document.getElementById("attType").value;
  await act(async()=>{
    const data=await fileToBase64(f);
    await serverPost({action:"addAttachment",ticket:id,type,name:f.name,mime:f.type,data});
  },"File uploaded.");
  openTicket(id);
}
async function addVideoLink(id){
  const url=document.getElementById("attUrl").value.trim();
  await act(()=>serverPost({action:"addAttachment",ticket:id,type:"Video",url}),"Video link added.");
  openTicket(id);
}

/* ---------- India map ---------- */
const NAME_MAP={"Odisha":"Orissa","Uttarakhand":"Uttaranchal"};
function geoBox(geom){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const polys=geom.type==="Polygon"?[geom.coordinates]:geom.coordinates;
  polys.forEach(rings=>rings[0].forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}));
  return {x0,x1,y0,y1};
}
function renderMap(){
  const showD=filters.showDist!==false;
  const list=visibleTickets().filter(t=>t.lat);
  const centers=CENTER_ROWS.filter(c=>Number(c["Lat"]) && Number(c["Lng"]));
  const hotNames=new Set();
  list.forEach(t=>hotNames.add(NAME_MAP[t.state]||t.state));
  centers.forEach(c=>hotNames.add(NAME_MAP[c["State"]]||c["State"]));

  const states=GEO_STATES.features.map(f=>`<path d="${geoPath(f.geometry)}" fill="${hotNames.has(f.properties.NAME_1)?"#D3E4F7":"#EEF3FA"}" stroke="#8FA9CC" stroke-width=".9"><title>${esc(f.properties.NAME_1)}</title></path>`).join("");
  const dists=showD?GEO_DIST.features.map(f=>`<path d="${geoPath(f.geometry)}" fill="none" stroke="#B7C7DD" stroke-width=".4"><title>${esc(f.properties.NAME_2)}, ${esc(f.properties.NAME_1)}</title></path>`).join(""):"";
  const labels=GEO_STATES.features.map(f=>{
    const b=geoBox(f.geometry);
    if((b.x1-b.x0)<1.2 && (b.y1-b.y0)<1.2) return "";
    const [x,y]=proj((b.x0+b.x1)/2,(b.y0+b.y1)/2);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="7.5" font-weight="700" text-anchor="middle" fill="#14355F" opacity=".85" style="pointer-events:none">${esc(f.properties.NAME_1)}</text>`;
  }).join("");
  const centerMarks=centers.map(c=>{
    const [x,y]=proj(Number(c["Lng"]),Number(c["Lat"]));
    return `<rect x="${(x-4.5).toFixed(1)}" y="${(y-4.5).toFixed(1)}" width="9" height="9" rx="1.5" fill="#fff" stroke="#14355F" stroke-width="1.8"><title>Center: ${esc(c["Center Name"])} (${esc(c["State"])})</title></rect>`;
  }).join("");
  const ticketPins=list.map(t=>{
    const [x,y]=proj(t.lng,t.lat);
    return `<g style="cursor:pointer" onclick="openTicket('${t.id}')"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="${STATUS_COLOR(t.status)}" stroke="#fff" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+3.2).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" style="pointer-events:none">${esc(t.project)}</text><title>${esc(t.id)} · ${esc(t.center)} · ${esc(t.status)}</title></g>`;
  }).join("");

  const legend=[["Center","#fff","#14355F","sq"],["Reported","#B03A2E","","c"],["In progress","#1F5FAD","","c"],["Quotation / approval","#B9770E","","c"],["Repaired / closed","#2E8B57","","c"]]
    .map(([l,fill,stroke,k])=>`<span class="row" style="gap:6px"><span style="width:12px;height:12px;display:inline-block;background:${fill};border:${k==="sq"?"2px solid "+stroke:"none"};border-radius:${k==="sq"?"2px":"50%"}"></span>${l}</span>`).join("");

  const byStateC={};
  centers.forEach(c=>{const k=c["State"]||"—";(byStateC[k]=byStateC[k]||[]).push(c["Center Name"]);});
  const centerRows=Object.entries(byStateC).sort((a,b)=>b[1].length-a[1].length)
    .map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${v.length}</td><td>${v.map(esc).join(", ")}</td></tr>`).join("");
  const byState={};list.forEach(t=>{byState[t.state]=(byState[t.state]||0)+1;});
  const ticketRows=Object.entries(byState).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("");

  return `
  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <label style="margin:0;display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink)"><input type="checkbox" style="width:auto" ${showD?"checked":""} onchange="filters.showDist=this.checked;render()"> Show district boundaries</label>
      <div class="row" style="gap:14px;font-size:12px;flex-wrap:wrap">${legend}</div>
    </div>
    <div style="width:100%;overflow:hidden;background:#F7FAFD;border-radius:10px;border:1px solid var(--line)">
      <svg viewBox="0 0 ${MAP_W} ${MAP_H}" style="width:100%;height:auto;display:block" role="img" aria-label="Map of India with states, centers and maintenance locations">
        ${states}${dists}${labels}${centerMarks}${ticketPins}
      </svg>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">States with centers or tickets are shaded darker. Squares are centers from the Center Master sheet; circles are maintenance tickets (click to open). Pin positions are approximate.</p>
  </div>
  <div class="grid two">
    <div class="panel"><h2>Centers by state</h2>
      <div class="wrap"><table><thead><tr><th>State</th><th>Centers</th><th>Names</th></tr></thead><tbody>
      ${centerRows||'<tr><td colspan="3" class="muted">No centers yet. Add rows in the Center Master sheet with Lat and Lng.</td></tr>'}
      </tbody></table></div></div>
    <div class="panel"><h2>Tickets by state</h2>
      <div class="wrap"><table><thead><tr><th>State</th><th>Tickets</th></tr></thead><tbody>
      ${ticketRows||'<tr><td colspan="2" class="muted">No mapped tickets</td></tr>'}
      </tbody></table></div></div>
  </div>`;
}

/* ---------- State-wise report ---------- */
function stateRows(list){
  const m={};
  list.forEach(t=>{
    const k=t.state;m[k]=m[k]||{projects:new Set(),n:0,open:0,res:0,over:0,est:0,app:0};
    const o=m[k];o.projects.add(t.project);o.n++;
    if(["Closed","Verified"].includes(t.status))o.res++;else o.open++;
    if(isOverdue(t))o.over++;o.est+=t.estCost||0;o.app+=t.approved||0;
  });
  return Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>[k,[...v.projects].join(", "),v.n,v.open,v.res,v.over,v.est,v.app]);
}
function renderStates(){
  const rows=stateRows(visibleTickets());
  const tot=rows.reduce((a,r)=>{for(let i=2;i<8;i++)a[i]=(a[i]||0)+r[i];return a},[]);
  const body=rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]?`<span class="badge b-red">${r[5]}</span>`:"0"}</td><td>${money(r[6])}</td><td>${money(r[7])}</td></tr>`).join("");
  return `
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">State-wise maintenance report</h2>
    <button class="btn ghost" onclick="downloadCSV('state_report_demo.csv',['State','Projects','Tickets','Open','Resolved','Overdue','Estimated','Approved'],${esc(JSON.stringify(rows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]])))}})">Export CSV</button></div>
    <div class="wrap"><table><thead><tr><th>State</th><th>Projects</th><th>Tickets</th><th>Open</th><th>Resolved</th><th>Overdue</th><th>Estimated</th><th>Approved</th></tr></thead>
    <tbody>${body||'<tr><td colspan="8" class="muted">No data</td></tr>'}</tbody>
    ${rows.length?`<tfoot><tr><td><b>Total</b></td><td></td><td><b>${tot[2]}</b></td><td><b>${tot[3]}</b></td><td><b>${tot[4]}</b></td><td><b>${tot[5]}</b></td><td><b>${money(tot[6])}</b></td><td><b>${money(tot[7])}</b></td></tr></tfoot>`:""}
    </table></div></div>`;
}

/* ---------- Expense report ---------- */
function renderExpense(){
  const list=visibleTickets();
  const est=list.reduce((a,t)=>a+(t.estCost||0),0);
  const app=list.reduce((a,t)=>a+(t.approved||0),0);
  const pending=list.filter(t=>["Quotation Required","Approval Pending"].includes(t.status)).reduce((a,t)=>a+(t.estCost||0),0);
  const byP={};list.forEach(t=>{const o=byP[t.project]=byP[t.project]||{n:0,est:0,app:0,pend:0};o.n++;o.est+=t.estCost||0;o.app+=t.approved||0;if(["Quotation Required","Approval Pending"].includes(t.status))o.pend+=t.estCost||0});
  const costly=list.filter(t=>t.estCost>0||t.approved>0).sort((a,b)=>(b.approved||b.estCost)-(a.approved||a.estCost));
  const cards=[["Estimated repair cost",money(est),"blue"],["Approved amount",money(app),"green"],["Pending approval",money(pending),"amber"],["Balance (est. − approved)",money(est-app),""]];
  return hero+`
  <div class="grid cards" style="margin-bottom:14px">${cards.map(([t,n,c])=>`<div class="card"><div class="t">${t}</div><div class="n ${c}">${n}</div></div>`).join("")}</div>
  <div class="grid two">
    <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Project-wise expense</h2>
      <button class="btn ghost" onclick="downloadCSV('expense_by_project_demo.csv',['Project','Tickets','Estimated','Approved','Pending'],${esc(JSON.stringify(Object.entries(byP).map(([k,v])=>[k,v.n,v.est,v.app,v.pend])))}})">Export CSV</button></div>
      <div class="wrap"><table><thead><tr><th>Project</th><th>Tickets</th><th>Estimated</th><th>Approved</th><th>Pending</th></tr></thead><tbody>
      ${Object.entries(byP).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${money(v.est)}</td><td>${money(v.app)}</td><td>${money(v.pend)}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="panel"><h2>State-wise expense</h2>
      <div class="wrap"><table><thead><tr><th>State</th><th>Estimated</th><th>Approved</th></tr></thead><tbody>
      ${stateRows(list).map(r=>`<tr><td>${esc(r[0])}</td><td>${money(r[6])}</td><td>${money(r[7])}</td></tr>`).join("")}
      </tbody></table></div></div>
  </div>
  <div class="panel" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Ticket-wise expense</h2>
    <button class="btn ghost" onclick="downloadCSV('expense_by_ticket_demo.csv',['Ticket','Project','State','Center','Category','Status','Estimated','Approved'],${esc(JSON.stringify(costly.map(t=>[t.id,t.project,t.state,t.center,t.category,t.status,t.estCost,t.approved])))}})">Export CSV</button></div>
    <div class="wrap"><table><thead><tr><th>Ticket</th><th>Project</th><th>State</th><th>Center</th><th>Issue</th><th>Status</th><th>Estimated</th><th>Approved</th></tr></thead><tbody>
    ${costly.map(t=>`<tr style="cursor:pointer" onclick="openTicket('${t.id}')"><td><b>${t.id}</b></td><td>${t.project}</td><td>${esc(t.state)}</td><td>${esc(t.center)}</td><td>${esc(t.category)}</td><td>${statusBadge(t.status)}</td><td>${money(t.estCost)}</td><td>${money(t.approved)}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">No expenses recorded</td></tr>'}
    </tbody></table></div></div>`;

  return tickets.filter(t=>{
    if(r.projects!=="all" && !r.projects.includes(t.project)) return false;
    return true;
  });
}
function isOverdue(t){
  if(["Closed","Verified"].includes(t.status)) return false;
  const age=(new Date()-new Date(t.reportDate))/86400000;
  return age>SLA_DAYS[t.priority];
}
function statusBadge(s){
  const cls=["Closed","Verified","Repair Completed"].includes(s)?"b-green":["Approval Pending","Quotation Required"].includes(s)?"b-amber":s==="Reported"?"b-red":"b-blue";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function prioBadge(p){
  const cls={Critical:"b-red",High:"b-amber",Medium:"b-blue",Low:"b-grey"}[p];
  return `<span class="badge ${cls}">${p}</span>`;
}
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
function nextStatus(s){const i=STATUSES.indexOf(s);return i<STATUSES.length-1?STATUSES[i+1]:null}

function render(){

/* ---------- Dashboard ---------- */
function summary(list){
  const open=list.filter(t=>!["Closed","Verified"].includes(t.status));
  return {
    total:list.length,
    working:list.filter(t=>["Repair Completed","Verified","Closed"].includes(t.status)).length,
    nonWorking:list.filter(t=>["Reported","Assigned","In Progress","Quotation Required","Approval Pending","Approved"].includes(t.status)).length,
    pending:list.filter(t=>t.status==="Reported").length,
    repair:list.filter(t=>t.status==="In Progress").length,
    warranty:list.filter(t=>t.warranty==="In Warranty").length,
    quote:list.filter(t=>["Quotation Required","Approval Pending"].includes(t.status)).length,
    resolved:list.filter(t=>["Verified","Closed"].includes(t.status)).length,
    overdue:open.filter(isOverdue).length
  };
}
function bars(title,key,list){
  const counts={};list.forEach(t=>counts[t[key]]=(counts[t[key]]||0)+1);
  const max=Math.max(1,...Object.values(counts));
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span class="v">${v}</span></div>`).join("");
  return `<div class="panel"><h2>${title}</h2>${rows||'<div class="muted">No data</div>'}</div>`;
}
function renderDash(){
  const list=visibleTickets(),s=summary(list);
  const hero=`<div class="hero">${EGF_LOGO}<div><div class="hero-t">Computer Maintenance Dashboard</div><div class="hero-s">Ekal Gramothan Foundation · ${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div></div></div>`;
  const cards=[["Total Tickets",s.total,"blue"],["Working (repaired)",s.working,"green"],["Non-Working",s.nonWorking,"red"],["Pending (Reported)",s.pending,"amber"],["Under Repair",s.repair,"blue"],["Warranty Cases",s.warranty,"blue"],["Quotation Pending",s.quote,"amber"],["Resolved",s.resolved,"green"],["Overdue (SLA)",s.overdue,"red"]];
  return `
  <div class="grid cards" style="margin-bottom:14px">${cards.map(([t,n,c])=>`<div class="card"><div class="t">${t}</div><div class="n ${c}">${n}</div></div>`).join("")}</div>
  <div class="grid two">
    ${bars("Tickets by project","project",list)}
    ${bars("Tickets by state","state",list)}
    ${bars("Tickets by status","status",list)}
    ${bars("Tickets by device type","device",list)}
  </div>
  <div class="panel" style="margin-top:14px"><h2>Recent tickets</h2>${ticketTable(list.slice().sort((a,b)=>b.reportDate.localeCompare(a.reportDate)).slice(0,5),false)}</div>`;
}

/* ---------- Tickets list ---------- */
function applyFilters(list){
  return list.filter(t=>{
    for(const k of ["project","state","center","tech","device","status"]){
      const f=filters[k];if(f&&f!=="All"){
        const field={center:"center",tech:"tech"}[k]||k;
        if(t[field]!==f) return false;
      }
    }
    if(filters.q){
      const q=filters.q.toLowerCase();
      if(!(`${t.id} ${t.center} ${t.asset} ${t.trainer} ${t.category}`.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}
function uniq(k){return ["All",...new Set(visibleTickets().map(t=>t[k]).filter(Boolean))]}
function opts(arr,cur){return arr.map(v=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("")}
function renderTickets(){
  const list=applyFilters(visibleTickets());
  const sorted=list.sort((a,b)=>String(a[sort.k]).localeCompare(String(b[sort.k]))*sort.dir);
  const pages=Math.max(1,Math.ceil(sorted.length/PAGE));if(page>pages)page=pages;
  const slice=sorted.slice((page-1)*PAGE,page*PAGE);
  const f=(k,label,arr)=>`<div><label>${label}</label><select onchange="filters['${k}']=this.value;page=1;render()">${opts(arr,filters[k]||"All")}</select></div>`;
  return `
  <div class="panel">
    <div class="filters">
      <div><label>Search</label><input value="${esc(filters.q||"")}" placeholder="ID, center, asset..." oninput="filters.q=this.value;page=1;render()"></div>
      ${f("project","Project",uniq("project"))}
      ${f("state","State",uniq("state"))}
      ${f("center","Center",uniq("center"))}
      ${f("tech","Technician",uniq("tech"))}
      ${f("device","Device type",uniq("device"))}
      ${f("status","Status",["All",...STATUSES])}
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span class="muted">${sorted.length} record(s)</span>
      <div class="row">
        <button class="btn ghost" onclick="exportCSV()" ${can().edit?"":""}>Export CSV</button>
        <button class="btn ghost" onclick="filters={};page=1;render()">Clear filters</button>
      </div>
    </div>
    ${ticketTable(slice,true,"sort")}
    <div class="pager">
      <button class="btn ghost" onclick="page=Math.max(1,page-1);render()" ${page<=1?"disabled":""}>Prev</button>
      <span>Page ${page} of ${pages}</span>
      <button class="btn ghost" onclick="page=Math.min(${pages},page+1);render()" ${page>=pages?"disabled":""}>Next</button>
    </div>
  </div>`;
}
function ticketTable(list,paged,mode){
  if(!list.length) return `<div class="muted" style="padding:14px">No tickets match these filters.</div>`;
  const th=(k,l)=>`<th onclick="sortBy('${k}')">${l}${sort.k===k?(sort.dir>0?" ▲":" ▼"):""}</th>`;
  return `<div class="wrap"><table>
    <thead><tr>${th("id","Ticket")}${th("project","Project")}${th("center","Center")}<th>Device / Asset</th><th>Issue</th>${th("priority","Priority")}${th("status","Status")}${th("tech","Technician")}${th("reportDate","Reported")}</tr></thead>
    <tbody>${list.map(t=>`<tr class="${isOverdue(t)?"over":""}" style="cursor:pointer" onclick="openTicket('${t.id}')">
      <td><b>${t.id}</b>${isOverdue(t)?` <span class="badge b-red">Overdue</span>`:""}</td>
      <td>${t.project}</td><td>${esc(t.center)}<div class="muted" style="font-size:11px">${esc(t.state)}, ${esc(t.district)}</div></td>
      <td>${t.device}<div class="muted" style="font-size:11px">${esc(t.asset)}</div></td>
      <td>${esc(t.category)}</td><td>${prioBadge(t.priority)}</td><td>${statusBadge(t.status)}</td>
      <td>${esc(t.tech)}</td><td>${t.reportDate}</td></tr>`).join("")}</tbody></table></div>`;
}
function sortBy(k){sort={k,dir:sort.k===k?-sort.dir:1};render()}
function exportCSV(){
  const list=applyFilters(visibleTickets());
  const cols=["id","project","zone","state","district","center","device","asset","category","priority","warranty","status","trainer","tech","reportDate","estCost","approved","remarks"];
  const csv=[cols.join(",")].concat(list.map(t=>cols.map(c=>`"${String(t[c]??"").replace(/"/g,'""')}"`).join(","))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="egf_tickets_demo.csv";a.click();
}

/* ---------- Ticket detail / workflow ---------- */
function openTicket(id){
  const t=tickets.find(x=>x.id===id);if(!t)return;selectedId=id;
  const idx=STATUSES.indexOf(t.status);
  const steps=STATUSES.map((s,i)=>`<span class="step ${i<idx?"done":i===idx?"cur":""}">${s}</span>`).join("");
  const r=ROLES[role];
  let actions="";
  if(r.edit && t.status!=="Closed"){
    const nx=nextStatus(t.status);
    const needsApproval=nx==="Approved"||(t.status==="Approval Pending");
    if(nx && !(needsApproval && !r.approve)) actions+=`<button class="btn" onclick="advance('${t.id}')">Move to: ${nx}</button> `;
    if(t.status==="Approval Pending" && !r.approve) actions+=`<span class="muted">Waiting for approver</span> `;
  }
  if(r.approve && t.status==="Approval Pending"){
    actions+=`<button class="btn g" onclick="approve('${t.id}',true)">Approve</button> <button class="btn ghost" onclick="approve('${t.id}',false)">Reject</button>`;
  }
  $("#modalBox").innerHTML=`
    <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:17px">${t.id} · ${esc(t.category)}</h2><button class="btn ghost" onclick="closeModal()">Close</button></div>
    <div class="steps">${steps}</div>
    <div class="kv" style="margin:12px 0">
      <div>Project / zone</div><div>${t.project} / ${t.zone}</div>
      <div>Location</div><div>${esc(t.center)}, ${esc(t.district)}, ${esc(t.state)}</div>
      <div>Device / asset</div><div>${t.device} · ${esc(t.asset)}</div>
      <div>Priority</div><div>${prioBadge(t.priority)} ${isOverdue(t)?'<span class="badge b-red">Overdue</span>':""}</div>
      <div>Warranty</div><div>${t.warranty}</div>
      <div>Reported by</div><div>${esc(t.trainer)} on ${t.reportDate}</div>
      <div>Technician</div><div>${esc(t.tech)}</div>
      <div>Estimated cost</div><div>${money(t.estCost)}</div>
      <div>Approved amount</div><div>${money(t.approved)}</div>
      <div>Remarks</div><div>${esc(t.remarks)||"—"}</div>
    </div>
    ${assignBox(t)}
    <div class="row">${actions}</div>
    <h3 style="font-size:13px;margin:16px 0 6px">History</h3>
    <div class="kv" style="grid-template-columns:110px 1fr">${t.history.slice().reverse().map(h=>`<div>${h.at}</div><div>${esc(h.by)}: ${esc(h.text)}</div>`).join("")}</div>
    <div style="margin-top:12px">${actionForm(t)}</div>${attachUI(t)}`;
  loadAttachments(id);
  $("#modal").classList.add("show");
}
function actionForm(t){
  if(!ROLES[role].edit) return "";
  return `<label>Add remark</label><div class="row"><input id="rm" placeholder="Remark or update"><button class="btn ghost" onclick="addRemark('${t.id}')">Add</button></div>`;
}
function addRemark(id){
  const t=tickets.find(x=>x.id===id);const v=$("#rm").value.trim();if(!v)return;
  t.history.push({at:daysAgo(0),by:role,text:v});pushStatus(t,t.status,v);openTicket(id);
}
function advance(id){
  const t=tickets.find(x=>x.id===id);const nx=nextStatus(t.status);if(!nx)return;
  if(nx==="Approved" && !ROLES[role].approve){flash={type:"err",msg:"Only an Approver can approve a repair."};return}
  t.history.push({at:daysAgo(0),by:role,text:`Status: ${t.status} → ${nx}`});t.status=nx;pushStatus(t,nx,"Status changed in CMMS");
  flash={type:"ok",msg:`${id} moved to ${nx}.`};
  openTicket(id);render();renderNav();
}
function approve(id,ok){
  const t=tickets.find(x=>x.id===id);
  if(ok){t.approved=t.estCost;t.status="Approved";t.history.push({at:daysAgo(0),by:role,text:`Approved ${money(t.estCost)}`})}
  else {t.status="Quotation Required";t.history.push({at:daysAgo(0),by:role,text:"Rejected; quotation to be revised"})}
  pushStatus(t,t.status,ok?"Approved in CMMS":"Returned for revision");
  flash={type:"ok",msg:`${id} ${ok?"approved":"returned for revision"}.`};
  closeModal();render();
}
function closeModal(){$("#modal").classList.remove("show")}

function submitRequest(){
  const need=["project","state","district","center","device","asset","category","trainer","reportDate","priority","warranty","desc"];
  let ok=true;
  need.forEach(k=>{const v=$("#"+k).value.trim();$("#e_"+k).textContent=v?"":"Required";if(!v)ok=false});
  if(!ok){flash={type:"err",msg:"Please complete the highlighted fields."};render();return}
  const n=Math.max(...tickets.map(t=>+t.id.slice(2)))+1;
  const id="T-"+n;
  const t={id,project:$("#project").value,zone:"",state:$("#state").value,district:$("#district").value,center:$("#center").value,device:$("#device").value,asset:$("#asset").value,category:$("#category").value,priority:$("#priority").value,warranty:$("#warranty").value,status:"Reported",trainer:$("#trainer").value,tech:$("#tech").value,reportDate:$("#reportDate").value,estCost:+$("#estCost").value||0,approved:0,remarks:$("#desc").value+($("#remarks").value?" | "+$("#remarks").value:""),history:[{at:daysAgo(0),by:role,text:"Ticket created"}]};
  tickets.push(t);
  if(google.connected) sheetPost({name:t.trainer,mobile:"-",project:t.project,state:t.state,district:t.district,center:t.center,device:t.device,asset:t.asset,cat:t.category,desc:t.remarks||"-",date:t.reportDate,pri:t.priority,warranty:t.warranty,affected:1,ref:t.id,technician:t.tech,source:"CMMS"}).catch(()=>{});
  flash={type:"ok",msg:`Request ${id} has been created. It is now listed in All Tickets.`};
  view="All Tickets";renderNav();render();
}

let SESSION=null, ME=null, TECH_ROWS=[], USER_ROWS=[], CENTER_ROWS=[];
const SHEET_CFG={url:"https://script.google.com/macros/s/AKfycbwWsCljcRL0U7xDEsEh95Z2Sq8t4F8rImKzz8Op64hWN0BgGvgsL5NnSLmQ8c0LtDMV/exec"};
const ROLE_LIST=Object.keys(ROLES);
async function serverGet(params){
  const u=new URL(SHEET_CFG.url);
  Object.entries({...params,session:SESSION}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString());const j=await r.json();
  if(!j.ok) throw new Error(j.error||"Request failed");
  return j;
}
async function serverPost(body){
  const r=await fetch(SHEET_CFG.url,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...body,session:SESSION})});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||"Request failed");
  return j;
}
function sheetPost(b){return serverPost(b);}
function mapRow(r){
  const district=r["District"]||"";const c=CITY_COORDS[district]||[];
  return {id:String(r["Ticket ID"]),project:r["Project"]||"",zone:r["Zone"]||"",state:r["State"]||"",district,
    center:r["Center"]||"",device:r["Device Type"]||"",asset:r["Asset ID"]||"",category:r["Issue Category"]||"",
    priority:r["Priority"]||"Medium",warranty:r["Warranty"]||"",status:r["Status"]||"Reported",
    trainer:r["Reported By"]||"",tech:r["Assigned Technician"]||"",reportDate:String(r["Report Date"]||r["Submitted At"]||"").slice(0,10),
    estCost:Number(r["Estimated Cost"])||0,approved:Number(r["Approved Amount"])||0,remarks:r["Remarks"]||"",
    lat:c[0],lng:c[1],history:[]};
}
async function syncNow(){
  google.status="Syncing...";render();
  try{
    const j=await serverGet({action:"list"});
    tickets=j.rows.map(mapRow);
    google.connected=true;google.status="Synced";google.lastSynced=new Date().toLocaleString("en-IN");google.error=null;
  }catch(e){
    google.connected=false;google.status="Error";
    google.error="Sync failed: "+(e.message==="Failed to fetch"?"could not reach the server.":e.message);
  }
  renderNav();render();
}
async function act(fn,okMsg){
  try{ await fn(); flash={type:"ok",msg:okMsg}; }
  catch(e){ flash={type:"err",msg:e.message==="Failed to fetch"?"Could not reach the server. Check your internet connection.":e.message}; }
  render();
}
function pushStatus(t,status,remark){
  if(!google.connected) return;
  serverPost({action:"status",ticket:t.id,status,remark:remark||"",technician:t.tech,approved:t.approved})
    .catch(e=>{flash={type:"err",msg:"Could not save to the Google Sheet: "+e.message};render();});
}
async function loadTechs(){ TECH_ROWS=(await serverGet({action:"technicians"})).rows; }
async function loadCenters(){ CENTER_ROWS=(await serverGet({action:"centers"})).rows; }
async function loadUsers(){ USER_ROWS=(await serverGet({action:"users"})).rows; }

/* ---------- Sign-in gate ---------- */
function gv(id){return document.getElementById(id).value.trim();}
function gpw(id){return document.getElementById(id).value;}
function gMsg(t,ok){const m=document.getElementById("gMsg");m.textContent=t||"";m.style.color=ok?"#1E6B41":"#B03A2E";m.style.display=t?"block":"none";}
function gShow(id){["gLogin","gSignup","gReset"].forEach(x=>document.getElementById(x).style.display=(x===id?"block":"none"));gMsg("",true);}
async function gPost(body){
  const r=await fetch(SHEET_CFG.url,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||"Request failed");
  return j;
}
function gErr(e){return e.message==="Failed to fetch"?"Could not reach the server. Check your internet connection.":e.message;}
async function gLogin(){
  const b=document.getElementById("gLoginBtn");b.disabled=true;b.textContent="Signing in...";
  try{
    const j=await gPost({action:"login",userId:gv("gId"),password:gpw("gPw")});
    SESSION=j.session;ME=j.user;
    await enterApp();
  }catch(e){gMsg(gErr(e),false);}
  finally{b.disabled=false;b.textContent="Sign in";}
}
async function gSignupStart(){
  if(gpw("sPw")!==gpw("sPw2")) return gMsg("The passwords do not match.",false);
  const b=document.getElementById("sBtn1");b.disabled=true;
  try{
    const j=await gPost({action:"signupStart",userId:gv("sId"),name:gv("sName"),email:gv("sEmail"),mobile:gv("sMobile"),role:gv("sRole"),password:gpw("sPw")});
    document.getElementById("gSignup1").style.display="none";document.getElementById("gSignup2").style.display="block";
    gMsg(j.message,true);
  }catch(e){gMsg(gErr(e),false);}
  finally{b.disabled=false;}
}
async function gSignupVerify(){
  const b=document.getElementById("sBtn2");b.disabled=true;
  try{
    const j=await gPost({action:"signupVerify",email:gv("sEmail"),code:gv("sCode")});
    gShow("gLogin");gMsg(j.message,true);
  }catch(e){gMsg(gErr(e),false);}
  finally{b.disabled=false;}
}
async function gResetStart(){
  const b=document.getElementById("rBtn1");b.disabled=true;
  try{
    const j=await gPost({action:"resetStart",email:gv("rEmail")});
    document.getElementById("gReset1").style.display="none";document.getElementById("gReset2").style.display="block";
    gMsg(j.message,true);
  }catch(e){gMsg(gErr(e),false);}
  finally{b.disabled=false;}
}
async function gResetVerify(){
  if(gpw("rPw")!==gpw("rPw2")) return gMsg("The passwords do not match.",false);
  const b=document.getElementById("rBtn2");b.disabled=true;
  try{
    const j=await gPost({action:"resetVerify",email:gv("rEmail"),code:gv("rCode"),password:gpw("rPw")});
    gShow("gLogin");gMsg(j.message,true);
  }catch(e){gMsg(gErr(e),false);}
  finally{b.disabled=false;}
}
async function enterApp(){
  document.getElementById("gate").style.display="none";
  document.querySelector(".app").style.display="flex";
  role=ME.role; ROLES[role].projects="all";
  view="Dashboard"; google.connected=false;
  $("#whoName").textContent=ME.name+" · "+ME.role;
  renderNav();
  await syncNow();
  try{ await loadTechs(); }catch(e){}
  try{ await loadCenters(); }catch(e){}
  if(role==="Admin"){ try{ await loadUsers(); }catch(e){} }
  render();
}
async function signOut(){
  try{ if(SESSION) await serverPost({action:"logout"}); }catch(e){}
  SESSION=null;ME=null;location.reload();
}

function renderGoogle(){
  const ok=google.connected;
  return `
  <div class="grid two">
    <div class="panel">
      <h2>Server connection</h2>
      <div class="kv" style="grid-template-columns:140px 1fr">
        <div>Status</div><div>${ok?'<span class="pill live">Connected</span>':'<span class="pill off">Not connected</span>'}</div>
        <div>Signed in as</div><div>${ME?esc(ME.name)+" ("+esc(ME.role)+")":"—"}</div>
        <div>Last synced</div><div>${google.lastSynced||"Never"}</div>
        <div>Sync status</div><div>${google.status}</div>
      </div>
      ${google.error?`<div class="err" style="margin-top:10px">${esc(google.error)}</div>`:""}
      <div class="row" style="margin-top:14px"><button class="btn" onclick="syncNow()">Sync now</button><button class="btn ghost" onclick="signOut()">Sign out</button></div>
    </div>
    <div class="panel"><h2>About this connection</h2>
      <p class="muted" style="font-size:13px;margin:0">Tickets, status changes, approvals, remarks, technicians and users are read from and saved to the Google Sheet through the server. Your session lasts 6 hours. Each role sees only the data allowed to it.</p>
    </div>
  </div>`;
}
function renderSettings(){
  return `<div class="panel"><h2>Settings</h2>
  <div class="form">
    <div><label>SLA – Critical (days)</label><input value="${SLA_DAYS.Critical}" disabled></div>
    <div><label>SLA – High (days)</label><input value="${SLA_DAYS.High}" disabled></div>
    <div><label>SLA – Medium (days)</label><input value="${SLA_DAYS.Medium}" disabled></div>
    <div><label>SLA – Low (days)</label><input value="${SLA_DAYS.Low}" disabled></div>
  </div>
  <p class="muted" style="font-size:12px;margin-top:12px">Email notifications (new request, assignment, quotation, approval, delay, closure) are sent by the server or Apps Script once the Google connection is configured.</p></div>`;
}

/* ---------- Init ---------- */
document.getElementById("gateLogo").innerHTML=EGF_LOGO;
document.querySelector(".app").style.display="none";
document.getElementById("gate").style.display="flex";
</script>
</body>
